[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libgx7"
version = "0.1.0"
description = "Library for GX7 robot"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pyserial"
]
authors = [
  {name = "Yunlong Dong"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libgx7*"]
[tool.setuptools.package-data]
"libgx7.robot.dynamics.gx7" = ["libregressor.so"]