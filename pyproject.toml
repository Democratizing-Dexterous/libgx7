[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libgx7"
version = "0.1.0"
description = "Library for GX7 robot"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Your Name"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libgx7*"]